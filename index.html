<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#351044">
<title>Spark_rich | Member Dashboard</title>
<style>
:root{--bg1:#321044;--bg2:#55206d;--panel:rgba(255,255,255,.085);--line:rgba(255,255,255,.13);--muted:#c8b3d2;--red:#b71920;--red2:#df292b;--gold:#ffd66e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#fff;background:linear-gradient(145deg,#401454,#642477 48%,#260b39);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.topbar{height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(28,8,39,.45);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(15px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.5px}.brand-mark{width:42px;height:42px;border-radius:12px;background:#080609;border:1px solid #d5a83d;display:grid;place-items:center;color:#f6d36e;font-size:20px}.brand small{display:block;color:#eacb70;font-size:9px;letter-spacing:2px}
.top-actions{display:flex;align-items:center;gap:12px}.avatar{height:40px;width:40px;border-radius:50%;background:linear-gradient(135deg,#f4a1a9,#a91325);display:grid;place-items:center;font-weight:bold;border:2px solid #ffffff44}
.layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:250px;padding:20px 14px;border-right:1px solid var(--line);background:rgba(20,5,30,.28);flex-shrink:0}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#eadff0;text-align:left;padding:13px 14px;border-radius:12px;font-size:14px}.nav button:hover,.nav button.active{background:linear-gradient(100deg,#a91b25aa,#682a65aa);color:#fff}.nav .ico{display:inline-block;width:27px}
main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:26px 24px 60px}.mobile-menu{display:none;background:transparent;color:#fff;font-size:24px}
h1{font-size:27px;margin:0 0 22px}h2{font-size:19px;margin:26px 0 14px}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 32px #16051d20;backdrop-filter:blur(12px)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stat{border-radius:18px;padding:20px;min-height:125px}.stat .label{font-size:12px;font-weight:700;opacity:.8}.stat strong{display:block;font-size:23px;margin:9px 0}.green{background:linear-gradient(120deg,#087b5c,#0ba87b)}.red{background:linear-gradient(120deg,#a51520,#d12b32)}.orange{background:linear-gradient(120deg,#a94b0c,#e27a18)}.blue{background:linear-gradient(120deg,#173e91,#2864c5)}.violet{background:linear-gradient(120deg,#5420a0,#8738d3)}.pink{background:linear-gradient(120deg,#95144e,#c51e68)}
.wallet{background:linear-gradient(115deg,#9f171f,#c72a32);border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin:18px 0}.wallet strong{font-size:27px}.wallet-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}.btn{padding:12px 17px;border-radius:11px;background:linear-gradient(110deg,var(--red),var(--red2));color:white;font-weight:750;box-shadow:0 7px 18px #8d101d44}.btn.secondary{background:#ffffff18;border:1px solid #ffffff2b;box-shadow:none}.btn.light{background:#fff;color:#69202b;box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}
.promo{background:linear-gradient(110deg,#142c57,#102b70);border-radius:18px;padding:19px;margin-bottom:18px;text-align:center}.promo h3{margin:0 0 6px;font-size:16px}.promo-packages{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.promo-packages div{background:#ffffff16;border:1px solid #ffffff22;border-radius:12px;padding:12px 5px;font-size:12px}.promo-packages b{display:block;color:#ffd66e;margin:5px 0}
.package{border-radius:18px;padding:20px;border:1px solid var(--line);background:linear-gradient(145deg,#ffffff14,#ffffff06)}.package h3{margin:0 0 8px}.package .price{font-size:25px;font-weight:900;margin:12px 0}.package p{color:var(--muted);font-size:13px;min-height:36px}.package .btn{width:100%;margin-top:10px}
.form-card{max-width:620px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#eadcf0;margin-bottom:8px}.field input,.field select{width:100%;padding:15px 16px;border-radius:12px;border:1px solid #ffffff26;background:#ffffff12;color:white;outline:none}.field input::placeholder{color:#c8b4d0}.field select option{color:#222}.full{width:100%}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px;font-size:13px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}th{color:#d7c4df;font-weight:650}.status{color:#53e1a6;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick button{padding:18px 8px;background:#ffffff0d;border:1px solid var(--line);color:white;border-radius:15px;font-weight:650}.quick span{display:block;font-size:23px;margin-bottom:9px}
.task{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.num{width:34px;height:34px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffe99b,#e6a92c);color:#512d12;font-weight:900}
.notice{padding:13px 15px;border-radius:12px;background:#f0a52b22;border:1px solid #f0c15a55;color:#ffe29a;font-size:13px;line-height:1.5;margin-top:14px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.authbox{width:min(100%,460px);text-align:center}.authbox .card{text-align:left;margin-top:25px}.authbox .brand{justify-content:center;margin-bottom:16px}.authbox p{color:var(--muted)}.auth-switch{color:#ff9b9e;cursor:pointer}.toast{position:fixed;right:18px;top:82px;background:#173f31;color:#b9ffe0;border:1px solid #4ed29b66;padding:13px 17px;border-radius:12px;z-index:10;box-shadow:0 10px 25px #0003}
@media(max-width:760px){.layout{display:block}.sidebar{display:none;position:fixed;z-index:8;top:68px;bottom:0;width:260px;background:#230b30f5;box-shadow:12px 0 35px #0005}.sidebar.open{display:block}.mobile-menu{display:block}.topbar{padding:0 14px}main{padding:22px 15px 45px}.grid,.stats{grid-template-columns:1fr}.wallet{align-items:flex-start;flex-direction:column}.quick{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.promo-packages div{font-size:10px}.promo-packages b{font-size:12px}}
</style>
</head>
<body>
<section id="auth" class="auth">
 <div class="authbox">
  <div class="brand"><div class="brand-mark">♛</div><div>SPARK_RICH<small>MEMBER PLATFORM</small></div></div>
  <p id="auth-caption">Welcome back. Sign in to continue.</p>
  <div class="card">
   <form id="login-form">
    <div class="field"><label>Username</label><input id="login-user" required placeholder="Your username"></div>
    <div class="field"><label>Password</label><input id="login-pass" type="password" required placeholder="Your password"></div>
    <button class="btn full">Sign In</button>
   </form>
   <form id="register-form" class="hidden">
    <div class="field"><label>Username</label><input id="reg-user" required minlength="3" placeholder="Choose a username"></div>
    <div class="field"><label>Email address</label><input id="reg-email" type="email" required placeholder="Email address"></div>
    <div class="field"><label>Phone number</label><input id="reg-phone" required placeholder="07XXXXXXXX"></div>
    <div class="field"><label>Country</label><select id="reg-country"><option>Kenya</option><option>Uganda</option><option>Tanzania</option><option>Other</option></select></div>
    <div class="field"><label>Sponsor username (optional)</label><input id="reg-sponsor" placeholder="Sponsor username"></div>
    <div class="field"><label>Password</label><input id="reg-pass" type="password" minlength="6" required placeholder="Create a password"></div>
    <button class="btn full">Create Account</button>
   </form>
   <p class="tiny" style="text-align:center;margin:18px 0 0" id="auth-toggle">Don't have an account? <span class="auth-switch" onclick="showRegister()">Create one</span></p>
   <p class="tiny" style="text-align:center"><span class="auth-switch" onclick="notify('Password reset requires a configured email service.')">Forgot password?</span></p>
  </div>
  <p class="tiny">Demo interface · No real deposits, transfers or withdrawals are processed.</p>
 </div>
</section>
<div id="app" class="hidden">
 <header class="topbar">
  <div class="top-actions"><button class="mobile-menu" onclick="toggleMenu()">☰</button><div class="brand"><div class="brand-mark">♛</div><div>SPARK_RICH<small>MEMBER PLATFORM</small></div></div></div>
  <div class="top-actions"><span id="header-user" class="tiny"></span><div class="avatar" id="avatar">S</div></div>
 </header>
 <div class="layout">
  <aside class="sidebar" id="sidebar"><nav class="nav">
   <button class="active" data-page="dashboard">▦　Dashboard</button>
   <button data-page="daily">⚑　Daily Ad</button>
   <button data-page="transfer">➤　Transfer Funds</button>
   <button data-page="deposit">↓　Add Funds</button>
   <button data-page="membership">♛　Membership</button>
   <button data-page="withdraw">↥　Withdraw</button>
   <button data-page="transactions">◷　Transaction History</button>
   <button data-page="team">♧　My Team</button>
   <button data-page="settings">⚙　Settings</button>
   <button onclick="logout()">↪　Sign Out</button>
  </nav></aside>
  <main id="main"></main>
 </div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
const PAYSTACK_PUBLIC_KEY = "pk_live_f5bd08f5184f17c64e864f85d4140323d8fbc923";
const packages=[{name:'Platinum',price:1500,desc:'Entry membership package',color:'#c9d4e8',icon:'🥈'},{name:'Grand',price:3000,desc:'Mid-tier membership package',color:'#ffd66e',icon:'🥇'},{name:'Boss',price:4000,desc:'Premium membership package',color:'#ffad68',icon:'👑'}];
let currentUser=null,activePage='dashboard',toastTimer;
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3200)}
function getUsers(){return JSON.parse(localStorage.getItem('sr_users')||'{}')}
function saveUsers(u){localStorage.setItem('sr_users',JSON.stringify(u))}
function showRegister(){document.getElementById('login-form').classList.add('hidden');document.getElementById('register-form').classList.remove('hidden');document.getElementById('auth-caption').textContent='Create your account to get started.';document.getElementById('auth-toggle').innerHTML='Already have an account? <span class="auth-switch" onclick="showLogin()">Sign in</span>'}
function showLogin(){document.getElementById('register-form').classList.add('hidden');document.getElementById('login-form').classList.remove('hidden');document.getElementById('auth-caption').textContent='Welcome back. Sign in to continue.';document.getElementById('auth-toggle').innerHTML='Don’t have an account? <span class="auth-switch" onclick="showRegister()">Create one</span>'}
function enter(user){currentUser=user;document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('header-user').textContent=user.username;document.getElementById('avatar').textContent=user.username[0].toUpperCase();render('dashboard');notify('Welcome to Spark_rich, '+user.username+'!')}
function logout(){currentUser=null;document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('hidden');showLogin()}
document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();const u=getUsers(),name=document.getElementById('login-user').value.trim().toLowerCase(),pass=document.getElementById('login-pass').value;if(!u[name]||u[name].password!==pass){notify('Incorrect username or password.');return}enter(u[name])});
document.getElementById('register-form').addEventListener('submit',e=>{e.preventDefault();const users=getUsers(),name=document.getElementById('reg-user').value.trim(),key=name.toLowerCase();if(users[key]){notify('That username is already registered.');return}const user={username:name,email:document.getElementById('reg-email').value,phone:document.getElementById('reg-phone').value,country:document.getElementById('reg-country').value,sponsor:document.getElementById('reg-sponsor').value,password:document.getElementById('reg-pass').value,membership:'None',balance:0,transactions:[]};users[key]=user;saveUsers(users);notify('Account created. Please sign in.');showLogin();document.getElementById('login-user').value=name});
function persist(){const users=getUsers();users[currentUser.username.toLowerCase()]=currentUser;saveUsers(users)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page);document.getElementById('sidebar').classList.remove('open')}));
function money(n){return 'KES '+Number(n||0).toLocaleString('en-KE')}
function tx(type,amount,note){currentUser.transactions.unshift({date:new Date().toLocaleString(),type,amount,note,status:'Demo'});persist()}
function render(page){activePage=page;const m=document.getElementById('main');const balance=money(currentUser.balance);let out='';
if(page==='dashboard')out=`<h1>Dashboard</h1><div class="promo"><h3>WELCOME TO SPARK_RICH</h3><div class="tiny">Membership packages and account overview</div><div class="promo-packages">${packages.map(p=>`<div>${p.icon}<b>${p.name.toUpperCase()}</b>${money(p.price)}</div>`).join('')}</div><span class="tiny">Explore membership options · Demo platform</span></div><div class="wallet"><div><div class="tiny">SPARK WALLET</div><strong>${balance}</strong><div class="tiny">Demo account balance</div></div><div class="wallet-actions"><button class="btn light" onclick="render('transfer')">⇄ Transfer</button><button class="btn secondary" onclick="render('deposit')">↓ Add Funds</button><button class="btn secondary" onclick="render('withdraw')">↥ Withdraw</button></div></div><h2>Account Overview</h2><div class="stats"><div class="stat green"><div class="label">MEMBER WALLET</div><strong>${balance}</strong><span class="tiny">Demo balance only</span></div><div class="stat red"><div class="label">TOTAL WITHDRAWALS</div><strong>KES 0</strong><span class="tiny">No real withdrawals</span></div><div class="stat orange"><div class="label">MEMBERSHIP</div><strong>${currentUser.membership}</strong><span class="tiny">Current package</span></div><div class="stat blue"><div class="label">INVESTMENT BALANCE</div><strong>KES 0</strong><span class="tiny">No investment functionality</span></div></div><h2>Quick Access</h2><div class="quick"><button onclick="render('membership')"><span>♛</span>Membership</button><button onclick="render('transactions')"><span>◷</span>History</button><button onclick="render('deposit')"><span>＋</span>Add Funds</button><button onclick="render('transfer')"><span>⇄</span>Transfer</button><button onclick="render('withdraw')"><span>↥</span>Withdraw</button><button onclick="render('daily')"><span>⚑</span>Daily Ad</button></div>`;
if(page==='membership')out=`<h1>Membership Packages</h1><p class="muted">Choose a package. Purchases are shown as a local demo only.</p><div class="grid">${packages.map(p=>`<div class="package"><div style="font-size:28px">${p.icon}</div><h3>${p.name}</h3><div class="price">${money(p.price)}</div><p>${p.desc}</p><button class="btn" onclick="demoMembership('${p.name}',${p.price})">Select ${p.name}</button></div>`).join('')}</div><div class="notice">Membership selection in this preview does not charge you or activate a paid service. Connect a verified payment backend before accepting payments.</div>`;
if(page==='deposit')out=`<h1>Add Funds</h1><div class="card form-card"><h3>Deposit request</h3><p class="muted">Current demo balance: ${balance}</p><div class="field"><label>Payment method</label><select id="pay-method"><option>M-Pesa (integration required)</option><option>Paystack (integration required)</option></select></div><div class="field"><label>Phone number</label><input id="pay-phone" placeholder="07XXXXXXXX" value="${currentUser.phone||''}"></div><div class="field"><label>Amount (KES)</label><input id="pay-amount" type="number" min="1" placeholder="Enter amount"></div><button class="btn full" onclick="demoRequest('Deposit')">Submit demo deposit request</button><div class="notice">No payment will be initiated in this preview. Real M-Pesa STK Push or Paystack checkout requires server-side payment initiation and verification.</div></div>`;
if(page==='transfer')out=`<h1>Transfer Funds</h1><div class="card form-card"><h3>Send to another user</h3><p class="muted">Available demo balance: ${balance}</p><div class="field"><label>Recipient username</label><input id="recipient" placeholder="Enter username"></div><div class="field"><label>Amount (KES)</label><input id="transfer-amount" type="number" min="1" placeholder="Enter amount"></div><button class="btn full" onclick="demoRequest('Transfer')">Send demo transfer</button><div class="notice">Transfers are not sent to other accounts. A secure backend and ledger are required for real transfers.</div></div>`;
if(page==='withdraw')out=`<h1>Withdrawals</h1><div class="card form-card"><h3>Withdrawal request</h3><p class="muted">Available demo balance: ${balance}</p><div class="field"><label>M-Pesa phone number</label><input id="withdraw-phone" placeholder="07XXXXXXXX" value="${currentUser.phone||''}"></div><div class="field"><label>Amount (KES)</label><input id="withdraw-amount" type="number" min="1" placeholder="Enter amount"></div><button class="btn full" onclick="demoRequest('Withdrawal')">Submit demo withdrawal request</button><div class="notice">No funds can be withdrawn from this front-end preview.</div></div>`;
if(page==='transactions')out=`<h1>Transaction History</h1><div class="card table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Details</th><th>Status</th></tr></thead><tbody>${(currentUser.transactions||[]).length?currentUser.transactions.map(t=>`<tr><td>${t.date}</td><td>${t.type}</td><td>${money(t.amount)}</td><td>${t.note}</td><td class="status">${t.status}</td></tr>`).join(''):'<tr><td colspan="5" class="muted" style="text-align:center">No transactions yet</td></tr>'}</tbody></table></div>`;
if(page==='daily')out=`<h1>Daily Ad</h1><div class="card"><h3>Daily activity guide</h3><p class="muted">This is an informational checklist. No earnings are promised or generated by completing these steps.</p>${['View the daily campaign or product information','Download approved promotional material','Share only if you choose and follow platform rules','Submit proof only when requested by a legitimate campaign','Review campaign terms before expecting any reward'].map((s,i)=>`<div class="task"><div class="num">${i+1}</div><div><b>${s}</b><div class="tiny">Follow the campaign instructions and terms.</div></div></div>`).join('')}<div class="notice">Do not pay fees or share account PINs to unlock supposed guaranteed earnings.</div></div>`;
if(page==='team')out=`<h1>My Team</h1><div class="card"><h3>Referral details</h3><p class="muted">Your username: <b>${currentUser.username}</b></p><p class="muted">Sponsor: ${currentUser.sponsor||'None'}</p><p class="tiny">Referral tracking needs a secure server-side implementation.</p></div>`;
if(page==='settings')out=`<h1>Settings</h1><div class="card form-card"><div class="field"><label>Username</label><input value="${currentUser.username}" disabled></div><div class="field"><label>Email</label><input value="${currentUser.email||''}" disabled></div><div class="field"><label>Phone</label><input value="${currentUser.phone||''}" disabled></div><button class="btn secondary" onclick="logout()">Sign out</button><div class="notice">This preview stores demo account data in this browser only. Do not use a real password here.</div></div>`;
m.innerHTML=out}
function demoMembership(name,price){
  if(!currentUser || !currentUser.email){notify('Add a valid email address to your account before paying.');return}
  if(typeof PaystackPop==='undefined'){notify('Paystack could not load. Check your internet connection and try again.');return}
  const handler=PaystackPop.setup({
    key:PAYSTACK_PUBLIC_KEY,
    email:currentUser.email,
    amount:Math.round(price*100),
    currency:'KES',
    ref:'SPARKRICH_'+Date.now()+'_'+Math.random().toString(36).slice(2,10),
    metadata:{
      custom_fields:[
        {display_name:'Spark_rich username',variable_name:'spark_rich_username',value:currentUser.username},
        {display_name:'Membership package',variable_name:'membership_package',value:name}
      ]
    },
    callback:function(response){
      notify('Payment submitted: '+response.reference+'. Membership will activate only after server-side verification.');
    },
    onClose:function(){notify('Paystack checkout closed. No membership was activated.');}
  });
  handler.openIframe();
}
function demoRequest(type){let amount=Number(document.getElementById(type==='Deposit'?'pay-amount':type==='Transfer'?'transfer-amount':'withdraw-amount')?.value||0);if(!amount||amount<1){notify('Enter a valid amount.');return}notify(type+' is disabled in this preview. No money moved.')}
</script>
</body>
</html>
